name: ci

# The repo is public, so Actions minutes are free. CI runs on every PR, and on
# pushes to the long-lived branches only: work branches get CI from their PR, so a
# push to a branch with an open PR runs once, not twice. There are no path
# filters, because the required checks must report on every PR.
on:
  push:
    branches: [main, "epic/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visuals:
        # Visual baselines are generated on CI Linux only (local font rendering
        # differs). Dispatch with this set, then download the artifact into
        # apps/web/test/e2e and commit it.
        description: Regenerate the Playwright visual baselines and upload them as an artifact
        type: boolean
        default: false

# Read-only token: no job pushes or comments. Visual baselines leave as an
# artifact and are committed by hand.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same PR or branch. main is
# exempt so every merge there keeps a complete result. The event name is part of
# the group so a push never cancels a workflow_dispatch (e.g. update_visuals).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node-pnpm:
    # Typecheck + unit tests under Node. The Playwright e2e runs separately in the
    # sharded `web-e2e` job below, so this job stays fast (~2-3 min) and no longer
    # gates on the full ~10-min browser suite.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The web unit run does not need Bun, but keep parity of the toolchain simple.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Typecheck all workspaces
        run: pnpm -r typecheck
      - name: Unit tests (schema + module-sdk + contract + drift + server + web)
        run: |
          pnpm --filter @deck/schema test
          pnpm --filter @deck/module-sdk test
          pnpm --filter @deck/contract test
          pnpm --filter @deck/drift test
          pnpm --filter @deck/server test
          pnpm --filter @deck/web test:unit

  web-e2e:
    # Playwright e2e, sharded across runners. The suite is workers:1 /
    # fullyParallel:false by design (shared runtime dir + a single Bun API per
    # run), so parallelism comes from cross-runner shards — each shard boots its
    # own webServer and runs a disjoint subset. Playwright shards by whole file
    # and the largest file (inventory, ~42 of 91 tests) is the atomic floor, so
    # two shards (~42 vs ~49) roughly halve the wall time; more shards just idle.
    runs-on: ubuntu-latest
    # A shard normally takes ~13 min; a hang fails here instead of at the 6 h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      # The e2e webServer boots the Bun-only API (`exec bun …`); without Bun on
      # PATH it exits 127.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      # Cache the downloaded browser binary, keyed by the resolved Playwright
      # version in the lockfile so an upgrade invalidates it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @deck/web exec playwright install --with-deps chromium
      - name: e2e (shard ${{ matrix.shard }})
        if: ${{ !inputs.update_visuals }}
        run: pnpm --filter @deck/web exec playwright test --shard=${{ matrix.shard }}
      # The update_visuals dispatch regenerates every `toHaveScreenshot` baseline
      # on this Linux image (one shard does it) instead of verifying them. Fetch:
      #   gh run download <run-id> -n visual-baselines -D apps/web/test/e2e
      - name: Regenerate visual baselines
        if: ${{ inputs.update_visuals && matrix.shard == '1/2' }}
        env:
          UPDATE_VISUALS: "1"
        run: pnpm --filter @deck/web exec playwright test --grep "visual baselines" --update-snapshots
      - name: Upload visual baselines
        if: ${{ inputs.update_visuals && matrix.shard == '1/2' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/test/e2e/*-snapshots/
          if-no-files-found: error

  bun-parity:
    # One job, one step per workspace: a per-workspace matrix paid a runner
    # boot, Bun install and per-job minute round-up four times over. Each step
    # runs even if an earlier one fails, so every workspace still reports.
    # scripts/bun-parity-vitest.sh runs `bunx --bun vitest run` (plain `bunx`
    # follows vitest's node shebang and tests under Node), prints the Bun
    # version, and fails a run that is incomplete, failed, or executed nothing
    # (scripts/bun-parity-check.ts). Bun comes from .bun-version, the version
    # the runtime image ships.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install with Bun
        id: install
        run: bun install
      - name: Vitest under Bun (packages/schema)
        working-directory: packages/schema
        run: bash ../../scripts/bun-parity-vitest.sh
      - name: Vitest under Bun (packages/module-sdk)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/module-sdk
        run: bash ../../scripts/bun-parity-vitest.sh
      - name: Vitest under Bun (packages/contract)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/contract
        run: bash ../../scripts/bun-parity-vitest.sh
      - name: Guard self-test (a run that executes no test must fail)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/contract
        # GITHUB_ACTIONS=false: the expected failure must not annotate the PR.
        run: |
          if GITHUB_ACTIONS=false bash ../../scripts/bun-parity-vitest.sh -t zzz-no-such-test; then
            echo "::error::bun-parity-vitest.sh passed a run that executed no test"
            exit 1
          fi
      - name: Vitest under Bun (packages/drift)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/drift
        run: bash ../../scripts/bun-parity-vitest.sh
      - name: Vitest under Bun (apps/server)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/server
        run: bash ../../scripts/bun-parity-vitest.sh
      - name: Vitest under Bun (apps/web)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: bash ../../scripts/bun-parity-vitest.sh

  kernel-touch:
    # Informational: lists the kernel files this branch changes (see scripts/kernel-touch.ts).
    # It never fails the build; the count is a trend to watch, not a gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Kernel files touched
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Informational: a script failure (e.g. a git error, exit 2) is reported in the
          # summary with its stderr, but never fails the job.
          status=0
          bun scripts/kernel-touch.ts --base "origin/${BASE_REF}" > kernel-touch.txt 2>&1 || status=$?
          cat kernel-touch.txt
          {
            echo '### Kernel files touched'
            if [ "$status" -ne 0 ]; then echo "**kernel-touch exited ${status}** (output below)"; fi
            echo '```'; cat kernel-touch.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install with Bun
        run: bun install
      - name: Check golden render
        run: |
          bun apps/server/src/cli/deck.ts render packages/schema/src/fixtures/primary --out /tmp/rendered.deck.config.json
          diff -u apps/server/test/golden/deck.config.json /tmp/rendered.deck.config.json
      - name: Web bundle carries no select engine
        # A widget's `select` (JMESPath) is evaluated on the server only; the built bundle must
        # not contain the engine, however it might be reached.
        run: |
          (cd apps/web && bunx vite build --outDir /tmp/web-dist --emptyOutDir)
          if grep -rlE "TreeInterpreter|jmespath" /tmp/web-dist; then
            echo "::error::the JMESPath engine reached the web bundle"
            exit 1
          fi
      - name: Web build shares one React through its import map
        run: node apps/web/scripts/check-web-build.mjs /tmp/web-dist
      - name: Bare-Bun boot smoke
        run: |
          export DECK_PORT=8787
          DECK_CONFIG_DIR=packages/schema/src/fixtures/primary bun apps/server/src/server/boot.ts &
          BOOT_PID=$!
          trap 'kill "$BOOT_PID" 2>/dev/null || true' EXIT

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${DECK_PORT}/api/health" -o /tmp/health.json; then
              healthy=1
              break
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "::error::server did not become healthy under bare Bun within 30 seconds"
            exit 1
          fi

          # The smoke proves the server boots under bare Bun and serves a
          # well-formed health payload. Accept "degraded" as well as "ok":
          # fixtures/primary declares a git-repo markdown source that cannot be
          # cloned in a network-less CI runner, which is a correct degraded
          # health, not a boot failure.
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"(ok|degraded)"' /tmp/health.json
