schemaVersion: 2
integrations:
  - id: prometheus-primary
    kind: prometheus
    title: Prometheus
    baseUrl: "http://127.0.0.1:65532"
    credentialEnv: PROMETHEUS_TOKEN
    card:
      summaries:
        - id: cpu
          label: CPU load
          query: "avg(node_load1)"
          warning: 4
          critical: 8
          direction: above
        - id: memory
          label: Memory used
          query: "avg(node_memory_used_percent)"
          unit: "%"
          warning: 80
          critical: 90
          direction: above
        - id: disk-free
          label: Disk free
          query: "min(node_filesystem_free_percent)"
          unit: "%"
          warning: 20
          critical: 10
          direction: below
        - id: uptime
          label: Uptime
          query: "min(node_time_seconds - node_boot_time_seconds)"
          unit: "s"
  - id: alertmanager-primary
    kind: alertmanager
    title: Alertmanager
    baseUrl: "http://127.0.0.1:65531"
  - id: prometheus-secondary
    kind: prometheus
    title: Prometheus (secondary)
    baseUrl: "http://127.0.0.1:65530"
  # A schema-known kind with no in-deck provider — opaque to the provider runtime,
  # so it is never registered and renders only as a deep-link card.
  - id: opaque-tool
    kind: file-tree
    title: Opaque tool
    baseUrl: "http://127.0.0.1:65529"
