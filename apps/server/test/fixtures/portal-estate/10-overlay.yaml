schemaVersion: 1
hosts:
  - name: atlas
  - name: shadow
    hidden: true
services:
  - name: containers
    host: atlas
    bindings:
      docker: { container: deck-server }
    links:
      - { title: Containers, href: "https://containers.example.invalid/" }
  - name: status
    host: atlas
    bindings:
      gatus: { endpoint: portal-health }
    links:
      - { title: Status, href: "https://status.example.invalid/" }
  - name: hidden-service
    host: atlas
    hidden: true
  - name: hidden-host-service
    host: shadow
  - name: no-link
    host: atlas
groups:
  - id: primary
    title: Primary services
    order: 10
    icon: layout-grid
    items:
      - { type: service, host: atlas, name: containers, title: Containers }
      - { type: link, title: Runbook, href: "https://runbook.example.invalid/", description: Estate operations }
      - type: group
        id: monitoring
        title: Monitoring
        order: 20
        items:
          - { type: service, host: atlas, name: status, title: Status checks }
          - { type: link, title: Metrics, href: "https://metrics.example.invalid/" }
      - { type: service, host: atlas, name: no-link, title: No-link service }
      - { type: service, host: atlas, name: hidden-service }
      - { type: service, host: shadow, name: hidden-host-service }
  - id: empty
    title: Empty group
    order: 30
    items: []
integrations:
  - id: docker-proxy
    kind: docker
    title: Docker socket proxy
    baseUrl: "http://127.0.0.1:65534"
  - id: gatus-api
    kind: gatus
    title: Gatus API
    baseUrl: "http://127.0.0.1:65533"
