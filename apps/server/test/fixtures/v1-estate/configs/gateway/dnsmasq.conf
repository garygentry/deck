# Example dnsmasq configuration for the gateway appliance.
# Served by deck's Configs surface from a local file-tree source.

domain=home.example
local=/home.example/

# Upstream resolvers
server=192.0.2.1
no-resolv

# DHCP range for the LAN
dhcp-range=192.0.2.100,192.0.2.200,12h

# Static leases for known hosts
dhcp-host=nas,192.0.2.10
dhcp-host=apps,192.0.2.20
dhcp-host=media,192.0.2.21
