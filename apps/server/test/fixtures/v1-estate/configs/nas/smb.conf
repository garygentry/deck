; Example Samba configuration for the nas host.

[global]
   workgroup = HOME
   server string = nas
   security = user
   map to guest = never
   log file = /var/log/samba/%m.log
   max log size = 1000

[files]
   comment = Shared files
   path = /srv/files
   read only = no
   valid users = admin

[backups]
   comment = Backup target
   path = /srv/nas-local
   read only = yes
   valid users = admin
