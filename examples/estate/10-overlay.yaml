schemaVersion: 2
estate:
  # A snapshot host older than this reads as "stale" in the inventory and
  # coverage views. The bundled example snapshot is stamped so most hosts land
  # inside this window and one (nas) lands outside it.
  freshness:
    snapshotStaleAfter: P2D
hosts:
  - name: gateway
    links: [{ title: Gateway UI, href: "https://gateway.home.example/" }]
  - name: nas
    links: [{ title: NAS Console, href: "https://nas.home.example/" }]
  - name: apps
  - name: media
    links: [{ title: Jellyfin, href: "https://media.home.example/" }]
services:
  - name: portal
    host: apps
    links: [{ title: Portal, href: "https://portal.home.example/" }]
  - name: files
    host: nas
    links: [{ title: Files, href: "https://files.home.example/" }]
  - name: jellyfin
    host: media
    links: [{ title: Jellyfin, href: "https://media.home.example/" }]
modules:
  portal:
    groups:
      - id: overview
        title: Overview
        order: 1
        items:
          - { type: service, host: apps, name: portal, title: Portal }
          - { type: service, host: nas, name: files, title: Files }
          - { type: service, host: media, name: jellyfin, title: Jellyfin }
          - { type: link, title: Gateway, href: "https://gateway.home.example/" }
      - id: infrastructure
        title: Infrastructure
        order: 2
        items:
          - { type: link, title: NAS Console, href: "https://nas.home.example/" }
          - { type: link, title: Gateway UI, href: "https://gateway.home.example/" }
sources:
  - id: runbooks
    kind: markdown-tree
    title: Runbooks
    location: { path: examples/estate/docs }
  - id: host-configs
    kind: file-tree
    title: Host configs
    location: { path: examples/estate/configs }
# Presentation settings. The overlay owns `ui`, and every key is optional.
ui:
  brand:
    # The sidebar mark: an icon in place of the title's initial. `logoUrl` (an
    # http(s) URL or a root-relative path) shows an image instead; `title`
    # replaces the estate name in the sidebar and the browser tab.
    icon: server
  # The page "/" renders. The portal is the default; any page without path
  # parameters can be home (`page:inventory/hosts`, say), and stays at its own path.
  home: page:portal/overview
  # The sidebar. Listed groups come first, in this order; the built-in groups not
  # listed follow in their default order. This list is the default order, so it
  # changes nothing as written. A `label` renames a group's heading, an `icon`
  # shows beside it, and an id that is not built in is a new group, shown once
  # an entry is in it.
  nav:
    groups:
      - { id: overview }
      - { id: inventory }
      - { id: health }            # e.g. { id: health, label: Monitoring, icon: activity }
      - { id: operate }
      - { id: knowledge }
      # - { id: lab, label: Lab, icon: boxes }
    # Extra entries: external links (they open in a new tab) and separators.
    # items:
    #   - { id: nav:lab/grafana, group: lab, label: Grafana, href: "https://grafana.example.net", icon: gauge }
    #   - { id: nav:lab/rule, group: health, separator: true, order: 150 }
  # Overrides by the ids GET /api/ui lists. They replace, never merge: `false`
  # hides; `attachTo` moves (slot, order, and a nav entry's group).
  # extensions:
  #   pill:drift/summary: false
  #   pill:llm-usage/summary: { attachTo: { order: 5 } }
  #   nav:sources/docs: { attachTo: { group: lab } }
  #   page:llm-usage/overview: false
